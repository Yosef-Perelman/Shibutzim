# Checks on every pull request and every push to main (plan 005, architecture §10).
# Tests never call a real model, so no secret is needed here; the assistant evals run on demand.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Run it by hand from main to redeploy the same code (docs/deployment.md).
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older check run, but never a deployment that is already going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  server:
    name: server
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shibutzim
          POSTGRES_PASSWORD: shibutzim
          POSTGRES_DB: shibutzim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shibutzim -d shibutzim"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://shibutzim:shibutzim@localhost:5432/shibutzim
      TEST_DATABASE_URL: postgresql+psycopg://shibutzim:shibutzim@localhost:5432/shibutzim_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --frozen
      # Compose creates this database from docker/initdb; the service container does not.
      - name: Create the test database
        run: psql "postgresql://shibutzim:shibutzim@localhost:5432/shibutzim" -c "CREATE DATABASE shibutzim_test"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Migrations apply and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest -q

  client:
    name: client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the production image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy
    needs: [server, client, image]
    # Only a push to main is a release. Pull requests never deploy and never see the cloud.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets GitHub prove to Google who is asking (Workload Identity Federation)
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}/shibutzim:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            VITE_DEMO_USERS=${{ vars.DEMO_USERS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          secrets: |
            DATABASE_URL=database-url:latest
            JWT_SECRET=jwt-secret:latest
            GEMINI_API_KEY=gemini-api-key:latest
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --port=8080
            --cpu=1
            --memory=512Mi
            --cpu-boost
            --min-instances=0
            --max-instances=2
      - name: The new revision answers
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "${{ steps.deploy.outputs.url }}/api/health"; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "The service did not answer /api/health" >&2
          exit 1
