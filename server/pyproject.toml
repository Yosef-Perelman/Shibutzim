[project]
name = "shibutzim-server"
version = "0.1.0"
description = "Shibutzim – shift scheduling and pay for small teams of hourly workers (API server)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "tzdata>=2024.2",
    "google-genai==2.33.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "scripts"]
# The migrations folder is also called alembic; the library is third party.
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "pay_rule(name): tests that make up the edge-case matrix of one pay rule",
]
