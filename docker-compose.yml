# Local development database: PostgreSQL 16 with pgvector.
# Values come from .env (see .env.example); the defaults below match .env.example.
#
# `docker compose up -d db` starts only the database. `docker compose --profile app up -d --build`
# also builds the production image and runs it at http://localhost:8080 against that database,
# to see the deployed shape before it is deployed (plan 005).
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: shibutzim-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shibutzim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shibutzim}
      POSTGRES_DB: ${POSTGRES_DB:-shibutzim}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - shibutzim-db-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shibutzim} -d ${POSTGRES_DB:-shibutzim}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build:
      context: .
      args:
        VITE_DEMO_USERS: ${VITE_DEMO_USERS:-}
    container_name: shibutzim-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shibutzim}:${POSTGRES_PASSWORD:-shibutzim}@db:5432/${POSTGRES_DB:-shibutzim}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  shibutzim-db-data:
